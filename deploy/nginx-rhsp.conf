# ==============================================================================
# RHSP Nginx Proxy & Static Routing Configuration
# Hostinger Debian VPS setup
# ==============================================================================

# Upstream definition for Astro Standalone Node Server
upstream rhsp_node_backend {
    server 127.0.0.1:4321 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name roundholesquarepeg.com www.roundholesquarepeg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roundholesquarepeg.com www.roundholesquarepeg.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/roundholesquarepeg.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/roundholesquarepeg.com/privkey.pem;

    root /var/www/rhsp/dist/client;
    index index.html;

    # Gzip / Brotli compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. DYNAMIC SSR ROUTES: Proxy to Astro Node Server
    # Dynamic namespaces: /careers, /admin, /api
    # --------------------------------------------------------------------------

    location /careers {
        proxy_pass http://rhsp_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    location /admin {
        proxy_pass http://rhsp_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Extra security for admin console
        client_max_body_size 10M;
    }

    location /api {
        proxy_pass http://rhsp_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;

        client_max_body_size 5M;
    }

    # --------------------------------------------------------------------------
    # 2. STATIC ASSETS: Aggressively cached client assets
    # --------------------------------------------------------------------------

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # First-party tracker script
    location = /rhsp-track.js {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. EXISTING STATIC PRE-RENDERED PAGES: Fallback to static files
    # --------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
