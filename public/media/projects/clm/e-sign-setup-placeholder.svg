<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad2)" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="36" cy="30" r="14" fill="#F7941D" />
  <text x="64" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">E-Signature Configuration &amp; Signer Matrix</text>

  <!-- Step Tracker Header -->
  <rect x="50" y="90" width="1100" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="80" y="130" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ 1. Document Upload</text>
  <text x="320" y="130" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ 2. E-Stamping Initiated</text>
  <text x="600" y="130" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Signer Ordering (Active)</text>
  <text x="910" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">4. Final Execution</text>

  <!-- Two Columns: Vendor Signers & Internal Signers -->
  <!-- Left Box: Vendor Signers (Sign First) -->
  <rect x="50" y="185" width="530" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="50" y="185" width="530" height="50" rx="12" fill="#1E4B8F" opacity="0.3" />
  <text x="75" y="217" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Vendor Signers (Sign First · Preview + OTP)</text>
  <text x="75" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Configured for up to 4 vendor authorized signatories in sequence.</text>

  <!-- Vendor Signer Card 1 -->
  <rect x="75" y="280" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="95" y="300" width="30" height="30" rx="4" fill="#F7941D" />
  <text x="105" y="321" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="140" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Authorized Signatory 1</text>
  <text x="140" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">vendor.signatory1@vendor-domain.com · Mobile OTP: +91 98*** *****</text>
  <rect x="460" y="302" width="75" height="24" rx="12" fill="#10b981" opacity="0.2" />
  <text x="475" y="318" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Pending</text>

  <!-- Vendor Signer Card 2 -->
  <rect x="75" y="380" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="95" y="400" width="30" height="30" rx="4" fill="#334155" />
  <text x="105" y="421" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="140" y="415" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Authorized Signatory 2</text>
  <text x="140" y="438" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">vendor.signatory2@vendor-domain.com · Mobile OTP: +91 97*** *****</text>
  <rect x="460" y="402" width="75" height="24" rx="12" fill="#64748b" opacity="0.2" />
  <text x="473" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Queued</text>

  <!-- Add Vendor Signer Slot -->
  <rect x="75" y="480" width="480" height="50" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="210" y="511" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">+ Add Vendor Signer (2/4 used)</text>

  <!-- Right Box: Internal Signers (Follow in Order) -->
  <rect x="620" y="185" width="530" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="620" y="185" width="530" height="50" rx="12" fill="#1E4B8F" opacity="0.3" />
  <text x="645" y="217" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Internal Signers (Sign in Order Set · Mobile OTP)</text>
  <text x="645" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Configured for up to 4 internal corporate officers in sequence.</text>

  <!-- Internal Signer Card 1 -->
  <rect x="645" y="280" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="665" y="300" width="30" height="30" rx="4" fill="#334155" />
  <text x="675" y="321" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="710" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Head of Procurement</text>
  <text x="710" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">procurement.lead@enterprise-domain.com · Verified Directory ID</text>
  <rect x="1030" y="302" width="75" height="24" rx="12" fill="#64748b" opacity="0.2" />
  <text x="1043" y="318" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Queued</text>

  <!-- Internal Signer Card 2 -->
  <rect x="645" y="380" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="665" y="400" width="30" height="30" rx="4" fill="#334155" />
  <text x="675" y="421" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="710" y="415" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Legal Counsel (Authorizer)</text>
  <text x="710" y="438" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">legal.counsel@enterprise-domain.com · Verified Directory ID</text>
  <rect x="1030" y="402" width="75" height="24" rx="12" fill="#64748b" opacity="0.2" />
  <text x="1043" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Queued</text>

  <!-- Add Internal Signer Slot -->
  <rect x="645" y="480" width="480" height="50" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="780" y="511" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">+ Add Internal Signer (2/4 used)</text>

  <!-- Action Bar -->
  <rect x="50" y="660" width="1100" height="60" rx="10" fill="#1e293b" />
  <text x="80" y="696" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Execution trigger will dispatch SMS and email signing invites in the order shown.</text>
  <rect x="960" y="672" width="160" height="36" rx="6" fill="#1E4B8F" />
  <text x="980" y="695" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Initiate E-Sign Flow</text>
</svg>
