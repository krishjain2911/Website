    <text x="0" y="20" fill="#94a3b8" font-family="monospace" font-size="12">"templateId": "DOC-TMPL-001",</text>
    <text x="0" y="45" fill="#94a3b8" font-family="monospace" font-size="12">"language": "en-IN",</text>
