    <text x="165" y="100" fill="#F7941D" font-family="monospace" font-size="12">"Rahul Sharma",</text>

    <text x="20" y="130" fill="#60a5fa" font-family="monospace" font-size="12">"ApplicantAge":</text>
    <text x="165" y="130" fill="#F7941D" font-family="monospace" font-size="12">35,</text>

    <text x="20" y="160" fill="#60a5fa" font-family="monospace" font-size="12">"ApplicantAddress":</text>
    <text x="165" y="160" fill="#F7941D" font-family="monospace" font-size="12">"Flat 204, Pune",</text>

    <text x="20" y="190" fill="#60a5fa" font-family="monospace" font-size="12">"LoanAmount":</text>
    <text x="165" y="190" fill="#F7941D" font-family="monospace" font-size="12">"Rs. 10,00,000",</text>

    <text x="20" y="220" fill="#60a5fa" font-family="monospace" font-size="12">"Tranches": [</text>
    <text x="40" y="245" fill="#94a3b8" font-family="monospace" font-size="11">&#123; "num": 1, "amt": "Rs. 5,00,000" &#125;,</text>
    <text x="40" y="270" fill="#94a3b8" font-family="monospace" font-size="11">&#123; "num": 2, "amt": "Rs. 5,00,000" &#125;</text>
    <text x="20" y="295" fill="#60a5fa" font-family="monospace" font-size="12">]</text>

    <text x="0" y="325" fill="#94a3b8" font-family="monospace" font-size="12">&#125;,</text>
    <text x="0" y="355" fill="#94a3b8" font-family="monospace" font-size="12">"callbackUrl": "https://api.internal/v1/cb"</text>

    <!-- Execution Status Pill -->
    <rect x="0" y="440" width="340" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="468" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">✓ JSON Validated Against Schema</text>
    <text x="20" y="492" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">All 14 text &amp; table tokens mapped successfully.</text>
