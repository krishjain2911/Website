    <text x="8" y="117" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Flat 204, Pune</text>
    
    <text x="230" y="117" fill="#334155" font-family="system-ui, sans-serif" font-size="15">state that I have availed a loan of</text>
    
