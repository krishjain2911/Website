    <text x="8" y="152" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Rs. 10,00,000</text>
    
    <text x="140" y="152" fill="#334155" font-family="system-ui, sans-serif" font-size="15">and undertake to repay it as agreed.</text>

